name: CI

# Checks every pull request: types, tests and a production build.
# It uses no secrets, so it is safe to run on pull requests from forks.
on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
