name: CI

# Fast checks on every pull request: types, tests and a production build.
# Uses no secrets, so it is safe on pull requests from forks.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
