name: Release

# Builds the Android APK and publishes a GitHub Release with it attached.
# Two ways to start it:
#   - Push a tag like v0.2.0:   git tag v0.2.0 && git push origin v0.2.0
#   - Run it by hand (Actions > Release > Run workflow) and type the version, e.g. 0.2.0
#     (the tag is created on main for you).
# With the signing secrets (docs/SIGNING.md) the APK is SIGNED and installs over the previous
# version without losing data. Without them it is a debug APK and the release is marked pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (for example 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        run: |
          V="${VERSION#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Invalid version: $V"; exit 1; }
          echo "HOLGURA_VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HOLGURA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/holgura.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: app/android
        env:
          HOLGURA_KEYSTORE_PATH: ${{ runner.temp }}/holgura.jks
          HOLGURA_KEYSTORE_PASSWORD: ${{ secrets.HOLGURA_KEYSTORE_PASSWORD }}
          HOLGURA_KEY_ALIAS: ${{ secrets.HOLGURA_KEY_ALIAS }}
          HOLGURA_KEY_PASSWORD: ${{ secrets.HOLGURA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build debug APK (no signing key available)
        if: steps.signing.outputs.signed != 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check the APK has no network permission
        working-directory: ${{ github.workspace }}
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          APK=$(ls app/android/app/build/outputs/apk/*/*.apk | head -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK" | grep '^uses-permission' | sed -E "s/.*name='([^']+)'.*/\1/" | sort -u > "$RUNNER_TEMP/perms.txt" || true
          cat "$RUNNER_TEMP/perms.txt"
          if grep -Eq 'INTERNET|NETWORK_STATE|WIFI_STATE' "$RUNNER_TEMP/perms.txt"; then
            echo "::error::The APK declares a network permission"
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          BT='`'
          {
            echo "## Firma"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "APK firmado con la clave de Holgura. Huella SHA-256 del certificado: ${BT}${SHA}${BT}"
            else
              echo "APK de depuración, firmado con una clave de prueba. Huella: ${BT}${SHA}${BT}"
            fi
            echo
            echo "## Privacidad"
            echo
            echo "Esta versión **no tiene permiso de internet ni de red**: no puede enviar datos a ningún sitio."
            echo
            echo "Permisos que declara el APK (leídos con \`aapt2\` al compilar):"
            echo
            if [ -s "$RUNNER_TEMP/perms.txt" ]; then sed 's/^/- \`/; s/$/\`/' "$RUNNER_TEMP/perms.txt"; else echo "- ninguno"; fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/android/app/build/outputs/apk/*/*.apk "$RUNNER_TEMP/out/holgura-$TAG.apk"
          FLAGS=""
          if [ "$SIGNED" != "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" "$RUNNER_TEMP/out/holgura-$TAG.apk" \
            --target "$GITHUB_SHA" --title "Holgura $TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $FLAGS

      - uses: actions/upload-artifact@v7
        with:
          name: holgura-apk
          path: ${{ runner.temp }}/out/*.apk
