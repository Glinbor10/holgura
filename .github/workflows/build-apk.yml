name: Build APK

# Builds the Android APK only when a GitHub Release is published (or manually),
# and attaches it to that release.
# - With the signing secrets configured (see docs/SIGNING.md) it builds a SIGNED release APK
#   that installs over the previous version without losing data.
# - Without them (for example in a fork) it builds a debug APK.
# Pull requests are already checked by ci.yml, so this does not run on every push.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HOLGURA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/holgura.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: app/android
        env:
          HOLGURA_KEYSTORE_PATH: ${{ runner.temp }}/holgura.jks
          HOLGURA_KEYSTORE_PASSWORD: ${{ secrets.HOLGURA_KEYSTORE_PASSWORD }}
          HOLGURA_KEY_ALIAS: ${{ secrets.HOLGURA_KEY_ALIAS }}
          HOLGURA_KEY_PASSWORD: ${{ secrets.HOLGURA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build debug APK (no signing key available)
        if: steps.signing.outputs.signed != 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/android/app/build/outputs/apk/*/*.apk "$RUNNER_TEMP/out/holgura-${{ github.event.release.tag_name || github.run_number }}.apk"
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: holgura-apk
          path: ${{ runner.temp }}/out/*.apk

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP"/out/*.apk --clobber
